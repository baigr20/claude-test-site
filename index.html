<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="claude.nx.kg 的第一个测试网站，由 GitHub Pages 提供静态网页托管。">
  <title>claude.nx.kg · 测试网站</title>
  <style>
    :root { color-scheme: light; font-family: system-ui,-apple-system,"Segoe UI",sans-serif; color:#202d29; background:#f4f2eb; }
    * { box-sizing:border-box; } body { margin:0; } main { max-width:1000px; margin:auto; padding:48px 28px; }
    header { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #cdd1c7; padding-bottom:22px; gap:18px; }
    .brand { font-size:20px; font-weight:650; } .tag { font-size:12px; letter-spacing:.12em; color:#53675c; }
    .hero { padding:100px 0 76px; } .eyebrow { color:#526c57; font-size:14px; letter-spacing:.14em; }
    h1 { font-size:clamp(42px,7vw,76px); line-height:1.12; letter-spacing:-.05em; margin:24px 0; font-weight:650; }
    .intro { font-size:20px; line-height:1.8; max-width:650px; color:#53615a; }
    button { border:0; border-radius:5px; padding:14px 24px; font:inherit; background:#294f3c; color:white; cursor:pointer; margin-top:22px; }
    button:hover { background:#1e3c2d; } button:focus-visible { outline:3px solid #99b6a1; outline-offset:4px; }
    .details { display:grid; grid-template-columns:repeat(3,1fr); gap:30px; border-top:1px solid #cdd1c7; padding-top:28px; }
    .details h2 { font-size:14px; color:#526c57; font-weight:500; } .details p { line-height:1.7; }
    #message { min-height:28px; color:#294f3c; } footer { margin-top:70px; font-size:13px; color:#6c756e; }
    @media(max-width:600px) { main { padding:28px 22px; } .hero { padding:65px 0 40px; } .details { grid-template-columns:1fr; gap:8px; } .intro { font-size:18px; } }
  </style>
</head>
<body>
  <main>
    <header><span class="brand">claude.nx.kg</span><span class="tag">HELLO, WEB.</span></header>
    <section class="hero">
      <p class="eyebrow">第一个测试网站</p>
      <h1>从一个域名，<br>开始一个新想法。</h1>
      <p class="intro">欢迎来到 claude.nx.kg。这是一个部署在 GitHub Pages 上的静态测试页面，未来可以在这里放置个人介绍、文章或小工具。</p>
      <button id="test" type="button">测试页面交互</button>
      <p id="message" role="status" aria-live="polite"></p>
    </section>
    <section class="details" aria-label="网站信息">
      <div><h2>网站地址</h2><p>claude.nx.kg</p></div>
      <div><h2>网页托管</h2><p>GitHub Pages</p></div>
      <div><h2>当前版本</h2><p>01 / 测试首页</p></div>
    </section>
    <footer>一个新的开始 · 2026</footer>
  </main>
  <script>document.getElementById('test').addEventListener('click', function () { document.getElementById('message').textContent = '测试成功：页面交互工作正常。'; });</script>
</body>
</html>
