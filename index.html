<style>

-height:1.8;text-align:center;margin:17px 0 0}.conversation{max-width:720px;margin:30px auto 0}.message{margin:25px 0 32px;line-height:1.9;font-size:16px;overflow-wrap:anywhere;white-space:pre-wrap}.user{background:var(--side);padding:15px 20px;border-radius:13px}.assistant-heading{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;margin-bottom:10px}.assistant-heading img{width:24px;height:24px}.answer{padding-left:33px}.answer p{margin:0}.retry{font-size:11px;color:var(--muted);padding:7px 0;margin-top:9px}.typing{color:var(--muted);font-size:14px}.dock{width:min(720px,calc(100% - 60px));margin:0 auto;padding:8px 0 17px;flex-shrink:0}.dock .disclaimer{margin-top:9px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);padding:11px 18px;border:1px solid var(--line);border-radius:9px;background:var(--box);box-shadow:0 4px 20px #0001;font-size:13px;z-index:20}.scrim{display:none}

<div class="app"><button id="scrim" class="scrim" aria-label="关闭侧栏"></button>

<script>
'use strict';
const apiBase='https://claude-personal-api.bai1517735291.workers.dev';
const logoUrl='data:image/svg+xml;charset=utf-8,'+encodeURIComponent("<svg fill=\"#D97757\" role=\"img\" viewBox=\"0 0 24 24\" xmlns=\"http://www.w3.org/2000/svg\"><title>Claude</title><path d=\"m4.7144 15.9555 4.7174-2.6471.079-.2307-.079-.1275h-.2307l-.7893-.0486-2.6956-.0729-2.3375-.0971-2.2646-.1214-.5707-.1215-.5343-.7042.0546-.3522.4797-.3218.686.0608 1.5179.1032 2.2767.1578 1.6514.0972 2.4468.255h.3886l.0546-.1579-.1336-.0971-.1032-.0972L6.973 9.8356l-2.55-1.6879-1.3356-.9714-.7225-.4918-.3643-.4614-.1578-1.0078.6557-.7225.8803.0607.2246.0607.8925.686 1.9064 1.4754 2.4893 1.8336.3643.3035.1457-.1032.0182-.0728-.164-.2733-1.3539-2.4467-1.445-2.4893-.6435-1.032-.17-.6194c-.0607-.255-.1032-.4674-.1032-.7285L6.287.1335 6.6997 0l.9957.1336.419.3642.6192 1.4147 1.0018 2.2282 1.5543 3.0296.4553.8985.2429.8318.091.255h.1579v-.1457l.1275-1.706.2368-2.0947.2307-2.6957.0789-.7589.3764-.9107.7468-.4918.5828.2793.4797.686-.0668.4433-.2853 1.8517-.5586 2.9021-.3643 1.9429h.2125l.2429-.2429.9835-1.3053 1.6514-2.0643.7286-.8196.85-.9046.5464-.4311h1.0321l.759 1.1293-.34 1.1657-1.0625 1.3478-.8804 1.1414-1.2628 1.7-.7893 1.36.0729.1093.1882-.0183 2.8535-.607 1.5421-.2794 1.8396-.3157.8318.3886.091.3946-.3278.8075-1.967.4857-2.3072.4614-3.4364.8136-.0425.0304.0486.0607 1.5482.1457.6618.0364h1.621l3.0175.2247.7892.522.4736.6376-.079.4857-1.2142.6193-1.6393-.3886-3.825-.9107-1.3113-.3279h-.1822v.1093l1.0929 1.0686 2.0035 1.8092 2.5075 2.3314.1275.5768-.3218.4554-.34-.0486-2.2039-1.6575-.85-.7468-1.9246-1.621h-.1275v.17l.4432.6496 2.3436 3.5214.1214 1.0807-.17.3521-.6071.2125-.6679-.1214-1.3721-1.9246L14.38 17.959l-1.1414-1.9428-.1397.079-.674 7.2552-.3156.3703-.7286.2793-.6071-.4614-.3218-.7468.3218-1.4753.3886-1.9246.3157-1.53.2853-1.9004.17-.6314-.0121-.0425-.1397.0182-1.4328 1.9672-2.1796 2.9446-1.7243 1.8456-.4128.164-.7164-.3704.0667-.6618.4008-.5889 2.386-3.0357 1.4389-1.882.929-1.0868-.0062-.1579h-.0546l-6.3385 4.1164-1.1293.1457-.4857-.4554.0608-.7467.2307-.2429 1.9064-1.3114Z\"/></svg>");
const el=id=>document.getElementById(id);el('hero-mark').src=logoUrl;
const composer=el('composer'),prompt=el('prompt'),send=el('send'),records=el('conversation');
let chats=[],current=null,busy=false,timer=null,toastTimer=null,controller=null,requestSeq=0;
function notify(text){el('toast').textContent=text;el('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el('toast').hidden=true,2500);}
function sidebar(open){el('sidebar').classList.toggle('closed',!open);el('expand').setAttribute('aria-expanded',String(open));el('scrim').classList.toggle('open',open&&matchMedia('(max-width:760px)').matches);}
function refreshInput(){send.disabled=busy||!prompt.value.trim();prompt.style.height='auto';prompt.style.height=Math.min(prompt.scrollHeight,180)+'px';}
function renderHistory(){el('history').replaceChildren();if(!chats.length){const p=document.createElement('p');p.className='history-empty';p.textContent='你的对话会显示在这里。仅在本次页面打开期间保留。';el('history').append(p);}for(const chat of chats){const b=document.createElement('button');b.className='history-item'+(current===chat?' active':'');b.textContent=chat.title;b.title=chat.title;b.onclick=()=>{cancelPending();current=chat;render();if(matchMedia('(max-width:760px)').matches)sidebar(false);};el('history').append(b);}}
function cancelPending(){requestSeq++;controller?.abort();controller=null;clearTimeout(timer);timer=null;busy=false;refreshInput();}
function render(){const active=Boolean(current);el('welcome').hidden=active;records.hidden=!active;el('dock').hidden=!active;(active?el('chat-composer'):el('home-composer')).append(composer);el('title').textContent=active?current.title:'新对话';records.replaceChildren();if(active){for(const message of current.messages){const row=document.createElement('article');row.className='message '+message.role+(message.error?' error':'');if(message.role==='user'){row.textContent=message.text;}else{const heading=document.createElement('div');heading.className='assistant-heading';const mark=document.createElement('img');mark.src=logoUrl;mark.alt='';heading.append(mark,document.createTextNode('Grok 4.5'));const content=document.createElement('div');content.className='answer';const p=document.createElement('p');p.textContent=message.text;content.append(p);const retry=document.createElement('button');retry.className='retry';retry.textContent='复制回答';retry.onclick=async()=>{try{await navigator.clipboard.writeText(message.text);notify('已复制');}catch{notify('复制失败，请手动选择文本。');}};content.append(retry);row.append(heading,content);}records.append(row);}if(busy){const waiting=document.createElement('p');waiting.className='typing';waiting.textContent='Grok 正在回答 …';waiting.setAttribute('role','status');records.append(waiting);}}renderHistory();refreshInput();el('workspace').scrollTop=el('workspace').scrollHeight;}
async function submit(){const text=prompt.value.trim();if(!text||busy)return;if(!current){current={title:text.slice(0,26),messages:[]};chats.unshift(current);}current.messages.push({role:'user',text});prompt.value='';busy=true;const target=current,sequence=++requestSeq;controller=new AbortController();const signal=controller.signal;render();if(matchMedia('(max-width:760px)').matches)sidebar(false);timer=setTimeout(()=>controller?.abort(),135000);try{const messages=target.messages.filter(m=>!m.error).slice(-24).map(m=>({role:m.role,content:m.text}));const response=await fetch(apiBase+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'grok-4.5',messages}),signal,credentials:'omit',cache:'no-store'});const data=await response.json();if(sequence!==requestSeq)return;if(!response.ok)throw new Error(data.error||'中转暂不可用，请稍后再试');if(typeof data.content!=='string')throw new Error('中转没有返回有效回答');target.messages.push({role:'assistant',text:data.content});}catch(error){if(sequence!==requestSeq)return;target.messages.push({role:'assistant',text:error.name==='AbortError'?'请求超时，请稍后再试':(error.message==='Failed to fetch'?'目前网络不可用，等一会再试':error.message),error:true});}finally{if(sequence===requestSeq){clearTimeout(timer);timer=null;busy=false;controller=null;render();prompt.focus();}}}
composer.addEventListener('submit',event=>{event.preventDefault();submit();});prompt.addEventListener('input',refreshInput);prompt.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();submit();}});
el('new').onclick=()=>{cancelPending();current=null;prompt.value='';render();prompt.focus();if(matchMedia('(max-width:760px)').matches)sidebar(false);};el('collapse').onclick=()=>sidebar(false);el('expand').onclick=()=>sidebar(el('sidebar').classList.contains('closed'));el('scrim').onclick=()=>sidebar(false);el('all-chats').onclick=()=>{if(chats.length){cancelPending();current=chats[0];render();}else notify('还没有对话，先发送一个问题吧。');};el('attach').onclick=()=>notify('暂不支持附件上传，请直接输入文本。');document.querySelectorAll('[data-prompt]').forEach(button=>button.onclick=()=>{prompt.value=button.dataset.prompt;refreshInput();prompt.focus();});document.addEventListener('keydown',event=>{if(event.key==='Escape')sidebar(false);});sidebar(!matchMedia('(max-width:760px)').matches);render();
</script></body></html>
